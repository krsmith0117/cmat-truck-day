<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantity Ledger</title>
<link rel="stylesheet" href="tally-sheet.css">
<link rel="stylesheet" href="colors.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Quantity Ledger</h1>
      <div class="sub">700 cells — 350 numbered, 350 for entries</div>
    </div>
    <div class="ledger-sync">
      <span class="truck-box">
        Ledger
        <select class="ledger-select" id="ledgerSelect">
          <option value="__new__">+ New ledger…</option>
        </select>
        <input type="text" class="ledger-name-input" id="newLedgerName" placeholder="new ledger name" autocomplete="off" style="display:none;">
      </span>
      <button class="ghost-btn" id="loadLedgerBtn">Load</button>
      <button class="ghost-btn" id="syncBtn">☁ Sync now</button>
      <span class="sync-status" id="syncStatus">not loaded</span>
    </div>
  </header>

  <div class="layout">

    <div class="panel">
      <p class="panel-title">
        <span class="panel-title-left">
          Entry Grid
          <span class="truck-box">
            Truck #
            <input type="text" class="truck-input" id="truckNumber" inputmode="numeric" pattern="[0-9]" maxlength="1" placeholder="–" autocomplete="off">
          </span>
          <span class="truck-box">
            Unit #
            <input type="text" class="truck-input unit-input" id="truckUnit" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="––––––" autocomplete="off">
          </span>
        </span>
        <span class="hint" id="gridHint">select a blank cell to begin</span>
        <div class="color-mark-bar" id="colorMarkBar"></div>
      </p>
      <div class="grid-row">
        <div class="grid-col">
          <div id="gridScroll">
            <div class="grid" id="grid"></div>
          </div>
        </div>
      </div>
      <div class="grand-total">
        <span>Total of row totals</span>
        <b id="grandTotal">0</b>
      </div>
      <div class="color-totals" id="colorTotals"></div>
      <div class="grid-actions">
        <button class="ghost-btn" id="clearAll">Clear all entries</button>
        <button class="lock-btn locked" id="lockToggle">🔒 Locked</button>
      </div>
    </div>

    <div>
      <!-- <div class="panel" style="margin-bottom:16px;">
        <p class="panel-title">Cell Actions</p>
        <div class="selected-readout" id="selectedReadout">No cell selected</div>
        <button class="delete-btn" id="deleteBtn" disabled>Delete quantity</button>
      </div> -->

      <div class="panel">
        <p class="panel-title">Tally</p>
        <div class="tally-scroll">
          <table>
            <thead>
              <tr><th>Qty</th><th>Count</th><th>Qty × Count</th></tr>
            </thead>
            <tbody id="tallyBody"></tbody>
            <tfoot>
              <tr><td>Total</td><td id="totalCount">0</td><td id="totalProduct">0</td></tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

  </div>

  <div class="action-bar">
    <button class="action-btn" id="saveBtn">💾 Save</button>
    <button class="action-btn" id="printBtn">🖨 Print</button>
    <div class="qty-dock" id="qtyDock">
      <div class="dock-status" id="dockStatus"></div>
       <button class="delete-btn" id="deleteBtn" disabled>Delete quantity</button>
      <div class="qty-pad" id="pad"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="ledger-core.js"></script>
<script src="colors.js"></script>
<script src="email.js"></script>
<script src="snapshot.js"></script>
<script src="print.js"></script>
<script src="init.js"></script>
<script src="ledger-sync.js"></script>
</body>
</html>
