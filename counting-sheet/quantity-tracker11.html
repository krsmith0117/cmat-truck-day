<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantity Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#f6f3ec;
    --paper-line:#ded7c6;
    --ink:#22283a;
    --ink-soft:#5a5f70;
    --amber:#b8863c;
    --amber-soft:#f0e2c6;
    --red:#a8402e;
    --red-soft:#f3ddd6;
    --cell-empty:#ffffff;
    --ref-bg:#eef0e6;
    --lgreen:#cdeccb;
    --lgreen-btn:#e4f5e2;
    --lblue:#cfe6f5;
    --lblue-btn:#e4f1fa;
    --lyellow:#f5edb8;
    --lyellow-btn:#faf5d6;
    --lpink:#f5cfe0;
    --lpink-btn:#fae1ec;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    padding:28px 20px 60px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:1220px;
    margin:0 auto;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.2px;
  }

  .sub{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }

  .layout{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:24px;
  }

  @media (max-width: 960px){
    .layout{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--cell-empty);
    border:1px solid var(--paper-line);
    border-radius:6px;
    padding:18px;
  }

  .panel-title{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:15px;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .panel-title-left{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .truck-box{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .truck-input{
    width:32px;
    height:26px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    font-weight:600;
    border:1px solid var(--paper-line);
    border-radius:4px;
    background:#ffffff;
    color:var(--ink);
  }

  .truck-input:focus{
    outline:none;
    border-color:var(--amber);
  }

  .unit-input{
    width:74px;
    letter-spacing:0.05em;
  }

  .hint{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:400;
  }

  #gridScroll{
    overflow-x:auto;
    padding-bottom:6px;
  }

  .grid-row{
    display:flex;
    align-items:flex-end;
    gap:14px;
  }

  .grid-col{
    display:flex;
    flex-direction:column;
  }

  .pad-col{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex-shrink:0;
  }

  .grid{
    display:grid;
    gap:2px 3px;
    width:max-content;
  }

  .pairblock{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .refcell{
    width:30px;
    height:22px;
    border-radius:3px;
    background:var(--ref-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .cell{
    width:30px;
    height:30px;
    border:1px solid var(--paper-line);
    border-radius:3px;
    background:var(--cell-empty);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:500;
    cursor:pointer;
    user-select:none;
    color:var(--ink);
    transition:background .1s, border-color .1s, transform .05s;
  }

  .cell:hover{
    border-color:var(--amber);
  }

  .cell.filled{
    background:var(--amber-soft);
  }

  .cell.color-green{
    background:var(--lgreen);
  }

  .cell.color-blue{
    background:var(--lblue);
  }

  .cell.color-yellow{
    background:var(--lyellow);
  }

  .cell.color-pink{
    background:var(--lpink);
  }

  .cell.color-green.filled, .cell.color-blue.filled, .cell.color-yellow.filled, .cell.color-pink.filled{
    background-image:linear-gradient(0deg, rgba(0,0,0,0.06), rgba(0,0,0,0.06));
  }

  .cell.selected{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    transform:scale(1.06);
  }

  .rowtotal-block{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .rowtotal-label{
    width:44px;
    height:22px;
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    color:var(--ink-soft);
  }

  .rowtotal-cell{
    width:44px;
    height:30px;
    border-radius:3px;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:600;
  }

  .row-mail-status{
    width:44px;
    text-align:center;
    font-size:9px;
    color:var(--ink-soft);
    margin-top:2px;
    line-height:1.3;
  }

  .row-mail-status.sent{color:#2c5c2a;}
  .row-mail-status.sending{color:var(--amber);}
  .row-mail-status.error{color:var(--red);}

  .grand-total{
    margin-top:16px;
    padding:12px 14px;
    background:var(--ink);
    color:var(--paper);
    border-radius:6px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    font-size:13px;
  }

  .grand-total b{
    font-family:'Source Serif 4', serif;
    font-size:20px;
  }

  .grid-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }

  .ghost-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:7px 12px;
    border-radius:5px;
    border:1px solid var(--paper-line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--ink);}

  .lock-btn{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12px;
    padding:7px 14px;
    border-radius:5px;
    border:1px solid transparent;
    cursor:pointer;
    transition:background .1s, border-color .1s;
  }

  .lock-btn.locked{
    background:var(--red-soft);
    border-color:var(--red);
    color:var(--red);
  }
  .lock-btn.locked:hover{background:var(--red);color:#fff;}

  .lock-btn.unlocked{
    background:var(--lgreen-btn);
    border-color:var(--lgreen);
    color:#2c5c2a;
  }
  .lock-btn.unlocked:hover{background:var(--lgreen);}

  .pad-grid{
    display:none;
  }

  .pad-btn{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    padding:8px 4px;
    width:46px;
    border-radius:5px;
    border:1px solid var(--paper-line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition:background .1s, border-color .1s;
  }

  .pad-btn:hover{
    border-color:var(--amber);
    background:var(--amber-soft);
  }

  .pad-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }

  .color-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:10px;
  }

  .color-mark-bar{
    display:flex;
    gap:6px;
    margin-top:8px;
    flex-wrap:nowrap;
  }

  .color-mark-box{
    flex:0 0 auto;
    width:104px;
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:6px;
    border-radius:5px;
    border:1px solid var(--paper-line);
  }

  .color-mark-box.green{background:var(--lgreen-btn);}
  .color-mark-box.blue{background:var(--lblue-btn);}
  .color-mark-box.yellow{background:var(--lyellow-btn);}
  .color-mark-box.pink{background:var(--lpink-btn);}

  .color-mark-box .color-btn{
    width:100%;
    padding:5px 0;
    font-size:11px;
  }

  .color-name-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:4px 6px;
    border-radius:4px;
    border:1px solid var(--paper-line);
    background:#ffffff;
    color:var(--ink);
    width:100%;
  }

  .color-name-input:focus{
    outline:none;
    border-color:var(--ink);
  }

  .color-btn{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12px;
    padding:9px 0;
    border-radius:5px;
    cursor:pointer;
    border:1px solid transparent;
  }

  .color-btn.green{
    background:var(--lgreen-btn);
    border-color:var(--lgreen);
    color:#2c5c2a;
  }
  .color-btn.green:hover{background:var(--lgreen);}

  .color-btn.blue{
    background:var(--lblue-btn);
    border-color:var(--lblue);
    color:#25577a;
  }
  .color-btn.blue:hover{background:var(--lblue);}

  .color-btn.yellow{
    background:var(--lyellow-btn);
    border-color:var(--lyellow);
    color:#7a6a1a;
  }
  .color-btn.yellow:hover{background:var(--lyellow);}

  .color-btn.pink{
    background:var(--lpink-btn);
    border-color:var(--lpink);
    color:#7a2d54;
  }
  .color-btn.pink:hover{background:var(--lpink);}

  .color-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }

  .color-totals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
  }

  .color-total-tile{
    border-radius:6px;
    padding:10px 12px;
    font-size:11px;
  }

  .color-total-tile b{
    display:block;
    font-family:'Source Serif 4', serif;
    font-size:20px;
    margin-top:2px;
  }

  .color-total-tile.green{
    background:var(--lgreen-btn);
    color:#2c5c2a;
  }

  .color-total-tile.blue{
    background:var(--lblue-btn);
    color:#25577a;
  }

  .color-total-tile.yellow{
    background:var(--lyellow-btn);
    color:#7a6a1a;
  }

  .color-total-tile.pink{
    background:var(--lpink-btn);
    color:#7a2d54;
  }

  .delete-btn{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    padding:11px 0;
    border-radius:5px;
    border:1px solid var(--red);
    background:var(--red-soft);
    color:var(--red);
    cursor:pointer;
    margin-bottom:18px;
  }

  .delete-btn:hover{
    background:var(--red);
    color:#fff;
  }

  .delete-btn:disabled{
    opacity:0.35;
    cursor:not-allowed;
    background:var(--paper);
    color:var(--ink-soft);
    border-color:var(--paper-line);
  }

  .selected-readout{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:14px;
    padding:8px 10px;
    background:var(--paper);
    border-radius:5px;
    border:1px solid var(--paper-line);
  }

  .selected-readout b{color:var(--ink);}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
  }

  th{
    text-align:left;
    font-weight:600;
    color:var(--ink-soft);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    border-bottom:1px solid var(--ink);
    padding:0 6px 6px;
  }

  th:not(:first-child), td:not(:first-child){text-align:right;}

  td{
    padding:5px 6px;
    border-bottom:1px solid var(--paper-line);
  }

  tr.zero td{color:#c3bfae;}

  tfoot td{
    border-top:2px solid var(--ink);
    border-bottom:none;
    font-weight:600;
    padding-top:8px;
  }

  .tally-scroll{
    max-height:420px;
    overflow-y:auto;
  }

  .action-bar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--paper-line);
    flex-wrap:wrap;
  }

  .action-btn{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    padding:10px 20px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .1s;
  }

  .action-btn:hover{opacity:0.85;}

  @media print{
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
    .action-bar, .grid-actions, #clearAll, .pad-col, .color-mark-bar, .panel:has(#selectedReadout), #lockToggle{
      display:none !important;
    }
    body{background:#fff;padding:0;}
    .panel{border:none;padding:0;}
    .layout{display:block;}
    .tally-scroll{
      max-height:none;
      overflow:visible;
    }
    table{
      page-break-inside:auto;
    }
    tr{
      page-break-inside:avoid;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Quantity Ledger</h1>
      <div class="sub">700 cells — 350 numbered, 350 for entries</div>
    </div>
  </header>

  <div class="layout">

    <div class="panel">
      <p class="panel-title">
        <span class="panel-title-left">
          Entry Grid
          <span class="truck-box">
            Truck #
            <input type="text" class="truck-input" id="truckNumber" inputmode="numeric" pattern="[0-9]" maxlength="1" placeholder="–" autocomplete="off">
          </span>
          <span class="truck-box">
            Unit #
            <input type="text" class="truck-input unit-input" id="truckUnit" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="––––––" autocomplete="off">
          </span>
        </span>
        <span class="hint" id="gridHint">select a blank cell to begin</span>
      </p>
      <div class="grid-row">
        <div class="grid-col">
          <div id="gridScroll">
            <div class="grid" id="grid"></div>
          </div>
          <div class="color-mark-bar">
            <div class="color-mark-box green">
              <button class="color-btn green" id="greenBtn" disabled>Mark green</button>
              <input type="text" class="color-name-input" id="greenName" placeholder="Name">
            </div>
            <div class="color-mark-box blue">
              <button class="color-btn blue" id="blueBtn" disabled>Mark blue</button>
              <input type="text" class="color-name-input" id="blueName" placeholder="Name">
            </div>
            <div class="color-mark-box yellow">
              <button class="color-btn yellow" id="yellowBtn" disabled>Mark yellow</button>
              <input type="text" class="color-name-input" id="yellowName" placeholder="Name">
            </div>
            <div class="color-mark-box pink">
              <button class="color-btn pink" id="pinkBtn" disabled>Mark pink</button>
              <input type="text" class="color-name-input" id="pinkName" placeholder="Name">
            </div>
          </div>
        </div>
        <div class="pad-col" id="pad"></div>
      </div>
      <div class="grand-total">
        <span>Total of row totals</span>
        <b id="grandTotal">0</b>
      </div>
      <div class="color-totals">
        <div class="color-total-tile green">
          <span id="greenLabel">Green cells total</span><b id="greenTotal">0</b>
        </div>
        <div class="color-total-tile blue">
          <span id="blueLabel">Blue cells total</span><b id="blueTotal">0</b>
        </div>
        <div class="color-total-tile yellow">
          <span id="yellowLabel">Yellow cells total</span><b id="yellowTotal">0</b>
        </div>
        <div class="color-total-tile pink">
          <span id="pinkLabel">Pink cells total</span><b id="pinkTotal">0</b>
        </div>
      </div>
      <div class="grid-actions">
        <button class="ghost-btn" id="clearAll">Clear all entries</button>
        <button class="lock-btn locked" id="lockToggle">🔒 Locked</button>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:16px;">
        <p class="panel-title">Cell Actions</p>
        <div class="selected-readout" id="selectedReadout">No cell selected</div>
        <button class="delete-btn" id="deleteBtn" disabled>Delete quantity</button>
      </div>

      <div class="panel">
        <p class="panel-title">Tally</p>
        <div class="tally-scroll">
          <table>
            <thead>
              <tr><th>Qty</th><th>Count</th><th>Qty × Count</th></tr>
            </thead>
            <tbody id="tallyBody"></tbody>
            <tfoot>
              <tr><td>Total</td><td id="totalCount">0</td><td id="totalProduct">0</td></tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

  </div>

  <div class="action-bar">
    <button class="action-btn" id="saveBtn">💾 Save</button>
    <button class="action-btn" id="printBtn">🖨 Print</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
/* ---------------------------------------------------------------------
   EmailJS configuration — fill these in from your EmailJS dashboard
   (emailjs.com → Email Services / Email Templates / Account → General).
   Until PUBLIC_KEY is set to a real value, row emails are skipped and a
   note is logged to the browser console instead of sending anything.
--------------------------------------------------------------------- */
const EMAILJS_SERVICE_ID  = 'service_0m0eo57';
const EMAILJS_TEMPLATE_ID = 'template_ddcvfcg';
const EMAILJS_PUBLIC_KEY  = 'hdaK9w6lEn-dri6Mp';
const NOTIFY_EMAIL = 'gracebibleocc@gmail.com';
// Must exactly match the "Attachment" parameter name configured in the
// EmailJS template's Attachments tab (dashboard.emailjs.com/admin/templates).
const EMAILJS_ATTACHMENT_FIELD = 'ledger_file';

const emailjsReady = typeof emailjs !== 'undefined'
  && EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== 'YOUR_PUBLIC_KEY';

if(emailjsReady){
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

const COLS = 25;
const PAIR_ROWS = 14; // 14 numbered rows * 25 cols = 350
const MIN_Q = 3, MAX_Q = 23;

const SAVED = window.__SAVED_STATE__ || null;

// data[pairRow][col] holds the entered quantity (or null) for the blank cell
// beneath reference number (pairRow*COLS + col + 1)
let data = SAVED ? SAVED.data : Array.from({length: PAIR_ROWS}, () => Array(COLS).fill(null));
let color = SAVED ? SAVED.color : Array.from({length: PAIR_ROWS}, () => Array(COLS).fill(null)); // null | 'green' | 'blue'
let selected = null; // {pr, c}

// Tracks which rows have already had their "row complete" email sent, so a
// row doesn't re-send every time a value inside it is edited afterward.
// Rows that are already fully filled when a saved file is reloaded are
// marked as already-sent so re-opening a saved ledger doesn't re-email.
let rowEmailSent = Array.from({length: PAIR_ROWS}, (_, pr) => isRowComplete(pr));
let rowEmailStatus = Array.from({length: PAIR_ROWS}, () => ''); // '', 'sending', 'sent', 'error'

const gridEl = document.getElementById('grid');
const padEl = document.getElementById('pad');
const tallyBody = document.getElementById('tallyBody');
const totalCountEl = document.getElementById('totalCount');
const totalProductEl = document.getElementById('totalProduct');
const selectedReadout = document.getElementById('selectedReadout');
const gridHint = document.getElementById('gridHint');
const deleteBtn = document.getElementById('deleteBtn');
const greenBtn = document.getElementById('greenBtn');
const blueBtn = document.getElementById('blueBtn');
const yellowBtn = document.getElementById('yellowBtn');
const pinkBtn = document.getElementById('pinkBtn');
const truckInput = document.getElementById('truckNumber');
const unitInput = document.getElementById('truckUnit');

truckInput.value = (SAVED && SAVED.truck) ? SAVED.truck : '';
truckInput.addEventListener('input', () => {
  // keep it to a single digit
  truckInput.value = truckInput.value.replace(/[^0-9]/g, '').slice(0, 1);
});

unitInput.value = (SAVED && SAVED.truckUnit) ? SAVED.truckUnit : '';
unitInput.addEventListener('input', () => {
  // keep it to at most 6 digits
  unitInput.value = unitInput.value.replace(/[^0-9]/g, '').slice(0, 6);
});

function refNumber(pr, c){
  return pr * COLS + c + 1;
}

function isRowComplete(pr){
  for(let c = 0; c < COLS; c++){
    if(data[pr][c] === null) return false;
  }
  return true;
}

function buildPad(){
  padEl.innerHTML = '';
  for(let q = MAX_Q; q >= MIN_Q; q--){
    const btn = document.createElement('button');
    btn.className = 'pad-btn';
    btn.textContent = q;
    btn.disabled = !selected;
    btn.addEventListener('click', () => setSelectedValue(q));
    padEl.appendChild(btn);
  }
}

function rowTotal(pr){
  let sum = 0;
  for(let c = 0; c < COLS; c++){
    sum += data[pr][c] ?? 0;
  }
  return sum;
}

function buildGrid(){
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, 30px) 44px`;
  gridEl.innerHTML = '';

  let grand = 0;
  let greenCount = 0;
  let blueCount = 0;
  let yellowCount = 0;
  let pinkCount = 0;

  for(let pr = 0; pr < PAIR_ROWS; pr++){
    for(let c = 0; c < COLS; c++){
      const block = document.createElement('div');
      block.className = 'pairblock';

      const ref = document.createElement('div');
      ref.className = 'refcell';
      ref.textContent = refNumber(pr, c);
      block.appendChild(ref);

      const cell = document.createElement('div');
      cell.className = 'cell';
      const val = data[pr][c];
      if(val !== null){
        cell.textContent = val;
        cell.classList.add('filled');
      }
      const cl = color[pr][c];
      if(cl === 'green') cell.classList.add('color-green');
      if(cl === 'blue') cell.classList.add('color-blue');
      if(cl === 'yellow') cell.classList.add('color-yellow');
      if(cl === 'pink') cell.classList.add('color-pink');
      if(selected && selected.pr === pr && selected.c === c){
        cell.classList.add('selected');
      }
      cell.addEventListener('click', () => selectCell(pr, c));
      block.appendChild(cell);

      gridEl.appendChild(block);

      if(cl === 'green') greenCount += (val ?? 0);
      if(cl === 'blue') blueCount += (val ?? 0);
      if(cl === 'yellow') yellowCount += (val ?? 0);
      if(cl === 'pink') pinkCount += (val ?? 0);
    }

    // row total cell at the end of the row
    const rt = rowTotal(pr);
    grand += rt;

    const totalBlock = document.createElement('div');
    totalBlock.className = 'rowtotal-block';

    const totalLabel = document.createElement('div');
    totalLabel.className = 'rowtotal-label';
    totalLabel.textContent = 'Total';
    totalBlock.appendChild(totalLabel);

    const totalCell = document.createElement('div');
    totalCell.className = 'rowtotal-cell';
    totalCell.textContent = rt;
    totalBlock.appendChild(totalCell);

    const mailStatus = document.createElement('div');
    mailStatus.className = 'row-mail-status';
    const status = rowEmailStatus[pr];
    if(status === 'sending'){
      mailStatus.textContent = 'mailing…';
      mailStatus.classList.add('sending');
    } else if(status === 'sent'){
      mailStatus.textContent = '✓ mailed';
      mailStatus.classList.add('sent');
    } else if(status === 'error'){
      mailStatus.textContent = 'mail failed';
      mailStatus.classList.add('error');
    }
    totalBlock.appendChild(mailStatus);

    gridEl.appendChild(totalBlock);
  }

  document.getElementById('grandTotal').textContent = grand;
  document.getElementById('greenTotal').textContent = greenCount;
  document.getElementById('blueTotal').textContent = blueCount;
  document.getElementById('yellowTotal').textContent = yellowCount;
  document.getElementById('pinkTotal').textContent = pinkCount;
}

function selectCell(pr, c){
  selected = {pr, c};
  const n = refNumber(pr, c);
  gridHint.textContent = 'cell selected — tap a quantity';
  selectedReadout.innerHTML = `Selected: <b>#${n}</b> — value: <b>${data[pr][c] ?? '—'}</b>`;
  deleteBtn.disabled = data[pr][c] === null;
  greenBtn.disabled = false;
  blueBtn.disabled = false;
  yellowBtn.disabled = false;
  pinkBtn.disabled = false;
  buildGrid();
  buildPad();
}

function advanceSelection(){
  let {pr, c} = selected;
  c++;
  if(c >= COLS){
    c = 0;
    pr++;
  }
  if(pr < PAIR_ROWS){
    selected = {pr, c};
    const n = refNumber(pr, c);
    gridHint.textContent = 'cell selected — tap a quantity';
    selectedReadout.innerHTML = `Selected: <b>#${n}</b> — value: <b>${data[pr][c] ?? '—'}</b>`;
    deleteBtn.disabled = data[pr][c] === null;
  } else {
    // reached the end of the grid
    gridHint.textContent = 'end of grid reached';
    selectedReadout.textContent = 'No cell selected';
    deleteBtn.disabled = true;
    greenBtn.disabled = true;
    blueBtn.disabled = true;
    yellowBtn.disabled = true;
    pinkBtn.disabled = true;
    selected = null;
  }
}

function toggleColor(c){
  if(!selected) return;
  const {pr, c: col} = selected;
  const applied = color[pr][col] !== c;
  color[pr][col] = applied ? c : null;

  if(applied){
    advanceSelection();
  }

  buildGrid();
  buildPad();
}

function setSelectedValue(q){
  if(!selected) return;
  const {pr} = selected;
  data[selected.pr][selected.c] = q;

  advanceSelection();

  buildGrid();
  buildPad();
  buildTally();

  maybeEmailRow(pr);
}

function deleteSelected(){
  if(!selected) return;
  const {pr} = selected;
  data[selected.pr][selected.c] = null;
  const n = refNumber(selected.pr, selected.c);
  selectedReadout.innerHTML = `Selected: <b>#${n}</b> — value: <b>—</b>`;
  deleteBtn.disabled = true;
  // row is no longer complete, so it's eligible to email again once refilled
  rowEmailSent[pr] = false;
  rowEmailStatus[pr] = '';
  buildGrid();
  buildTally();
}

function buildTally(){
  tallyBody.innerHTML = '';
  let totalCount = 0, totalProduct = 0;
  for(let q = MIN_Q; q <= MAX_Q; q++){
    let count = 0;
    for(let pr = 0; pr < PAIR_ROWS; pr++){
      for(let c = 0; c < COLS; c++){
        if(data[pr][c] === q) count++;
      }
    }
    const product = q * count;
    totalCount += count;
    totalProduct += product;

    const tr = document.createElement('tr');
    if(count === 0) tr.classList.add('zero');
    tr.innerHTML = `<td>${q}</td><td>${count}</td><td>${product}</td>`;
    tallyBody.appendChild(tr);
  }
  totalCountEl.textContent = totalCount;
  totalProductEl.textContent = totalProduct;
}

/* ---------------------------------------------------------------------
   Row auto-email: fires once, automatically, the moment all 25 cells in
   a row have a quantity entered. Uses EmailJS (client-side email API) so
   no server/backend is needed — just a Service ID, Template ID and
   Public Key from an EmailJS account, set at the top of this script.
--------------------------------------------------------------------- */
function maybeEmailRow(pr){
  if(rowEmailSent[pr]) return;
  if(!isRowComplete(pr)) return;

  rowEmailSent[pr] = true;
  sendRowEmail(pr);
}

function formatRowDetails(pr){
  const lines = [];
  for(let c = 0; c < COLS; c++){
    lines.push(`#${refNumber(pr, c)}: ${data[pr][c]}`);
  }
  return lines.join('\n');
}

/* Builds a full, self-contained snapshot of the ledger as it currently
   stands — the same "save to HTML" format the Save button produces,
   with all entered quantities/colors baked in as window.__SAVED_STATE__
   so opening the file reloads exactly this state. Shared by the Save
   button and by the row-complete email attachment. */
function buildLedgerSnapshotHtml(){
  const names = {
    green: document.getElementById('greenName').value,
    blue: document.getElementById('blueName').value,
    yellow: document.getElementById('yellowName').value,
    pink: document.getElementById('pinkName').value
  };
  const truck = truckInput.value;
  const truckUnit = unitInput.value;
  const stateJson = JSON.stringify({data, color, names, truck, truckUnit});
  const stateScript = '<script>window.__SAVED_STATE__ = ' + stateJson + ';<\/script>\n';
  return '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace('<head>', '<head>\n' + stateScript);
}

// Converts text to a base64 data: URI, the format EmailJS "Variable
// Attachment" template fields expect (as opposed to a raw File object,
// which is only for "Form File Attachment" / emailjs.sendForm()).
// Uses TextEncoder first so non-ASCII characters (emoji, em dashes, etc.
// used throughout this page) encode correctly instead of breaking btoa().
function toDataUri(text, mimeType){
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  for(let i = 0; i < bytes.length; i++){
    binary += String.fromCharCode(bytes[i]);
  }
  return `data:${mimeType};base64,${btoa(binary)}`;
}

function sendRowEmail(pr){
  const rowNumber = pr + 1;
  const refStart = refNumber(pr, 0);
  const refEnd = refNumber(pr, COLS - 1);
  const total = rowTotal(pr);

  const snapshotHtml = buildLedgerSnapshotHtml();
  const snapshotDataUri = toDataUri(snapshotHtml, 'text/html');

  const templateParams = {
    to_email: NOTIFY_EMAIL,
    truck_number: truckInput.value || '(not set)',
    truck_unit: unitInput.value || '(not set)',
    row_number: rowNumber,
    ref_start: refStart,
    ref_end: refEnd,
    row_total: total,
    row_details: formatRowDetails(pr),
    [EMAILJS_ATTACHMENT_FIELD]: snapshotDataUri
  };

  if(!emailjsReady){
    console.warn(
      '[Quantity Ledger] EmailJS is not configured — row', rowNumber,
      'would have been emailed to', NOTIFY_EMAIL, 'with the full sheet attached',
      'Fill in EMAILJS_SERVICE_ID / EMAILJS_TEMPLATE_ID / EMAILJS_PUBLIC_KEY at the top of the script to enable sending.',
      templateParams
    );
    rowEmailStatus[pr] = 'error';
    buildGrid();
    return;
  }

  rowEmailStatus[pr] = 'sending';
  buildGrid();

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
    .then(() => {
      rowEmailStatus[pr] = 'sent';
      buildGrid();
    })
    .catch((err) => {
      console.error('[Quantity Ledger] Row email failed for row', rowNumber, err);
      rowEmailStatus[pr] = 'error';
      rowEmailSent[pr] = false; // allow a retry later
      buildGrid();
    });
}

let clearLocked = true;
const lockToggle = document.getElementById('lockToggle');

lockToggle.addEventListener('click', () => {
  clearLocked = !clearLocked;
  if(clearLocked){
    lockToggle.textContent = '🔒 Locked';
    lockToggle.classList.remove('unlocked');
    lockToggle.classList.add('locked');
  } else {
    lockToggle.textContent = '🔓 Unlocked';
    lockToggle.classList.remove('locked');
    lockToggle.classList.add('unlocked');
  }
});

document.getElementById('clearAll').addEventListener('click', () => {
  if(clearLocked){
    alert('Clear All Entries is locked. Tap the lock button to unlock it first.');
    return;
  }
  if(!confirm('Are you sure you want to clear all entries?')){
    return;
  }
  data = Array.from({length: PAIR_ROWS}, () => Array(COLS).fill(null));
  color = Array.from({length: PAIR_ROWS}, () => Array(COLS).fill(null));
  rowEmailSent = Array.from({length: PAIR_ROWS}, () => false);
  rowEmailStatus = Array.from({length: PAIR_ROWS}, () => '');
  selected = null;
  selectedReadout.textContent = 'No cell selected';
  gridHint.textContent = 'select a blank cell to begin';
  deleteBtn.disabled = true;
  greenBtn.disabled = true;
  blueBtn.disabled = true;
  yellowBtn.disabled = true;
  pinkBtn.disabled = true;
  buildGrid();
  buildPad();
  buildTally();
});

deleteBtn.addEventListener('click', deleteSelected);
greenBtn.addEventListener('click', () => toggleColor('green'));
blueBtn.addEventListener('click', () => toggleColor('blue'));
yellowBtn.addEventListener('click', () => toggleColor('yellow'));
pinkBtn.addEventListener('click', () => toggleColor('pink'));

const colorLabelEls = {
  green: document.getElementById('greenLabel'),
  blue: document.getElementById('blueLabel'),
  yellow: document.getElementById('yellowLabel'),
  pink: document.getElementById('pinkLabel')
};
const colorDefaultLabels = {
  green: 'Green cells total',
  blue: 'Blue cells total',
  yellow: 'Yellow cells total',
  pink: 'Pink cells total'
};

['green', 'blue', 'yellow', 'pink'].forEach((c) => {
  const input = document.getElementById(c + 'Name');
  input.addEventListener('input', () => {
    const name = input.value.trim();
    colorLabelEls[c].textContent = name ? name : colorDefaultLabels[c];
  });
});

// ---- Bottom action bar ----

function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  let filename = prompt('Name this file:', 'quantity-ledger-saved');
  if(filename === null) return; // user cancelled

  filename = filename.trim();
  if(filename === '') filename = 'quantity-ledger-saved';
  // strip characters that aren't safe in filenames, and any existing extension
  filename = filename.replace(/\.html?$/i, '').replace(/[\\/:*?"<>|]/g, '');
  if(filename === '') filename = 'quantity-ledger-saved';

  const fullHtml = buildLedgerSnapshotHtml();
  const blob = new Blob([fullHtml], {type: 'text/html'});
  triggerDownload(blob, filename + '.html');
});

document.getElementById('printBtn').addEventListener('click', () => {
  window.print();
});

buildGrid();
buildPad();
buildTally();

if(SAVED && SAVED.names){
  ['green', 'blue', 'yellow', 'pink'].forEach((c) => {
    const name = SAVED.names[c];
    if(name){
      document.getElementById(c + 'Name').value = name;
      colorLabelEls[c].textContent = name;
    }
  });
}
</script>
